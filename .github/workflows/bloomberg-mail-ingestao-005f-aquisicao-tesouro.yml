name: BLOOMBERG_MAIL — INGESTÃO 005F — Aquisição Tesouro Direto

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/aquisicao_tesouro_direto_005.py"

permissions:
  contents: write

jobs:
  aquisicao-tesouro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aquisição, validação e preservação RAW
        run: python3 scripts/aquisicao_tesouro_direto_005.py
      - name: Publicar RAW, checksum e evidência
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/RAW/precotaxatesourodireto.csv EMAILS_RECEBIDOS/INGESTAO/005/RAW/precotaxatesourodireto.csv.sha256 EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/EXECUCAO_AUTOMATICA/aquisicao_tesouro_direto_005.json EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/EXECUCAO_AUTOMATICA/aquisicao_tesouro_direto_005.md
          git diff --cached --quiet || git commit -m "evidence: aquisição Tesouro Direto INGESTÃO 005"
          git push
