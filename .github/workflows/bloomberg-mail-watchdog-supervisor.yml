name: BLOOMBERG_MAIL — WATCHDOG Supervisor

on:
  workflow_dispatch:
  push:
    paths:
      - "WATCHDOG/**"
      - ".github/workflows/bloomberg-mail-watchdog-supervisor.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: bloomberg-mail-watchdog-supervisor
  cancel-in-progress: true

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          python -m py_compile WATCHDOG/scripts/watchdog.py WATCHDOG/adapters/replay.py WATCHDOG/adapters/b3_cotahist_status.py

      - name: Deterministic adapter tests
        run: python -m unittest discover -s WATCHDOG/tests -v

      - name: Validate against persisted B3 evidence
        run: |
          python WATCHDOG/adapters/b3_cotahist_status.py --root . --validate-only > /tmp/b3-cotahist-event.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/b3-cotahist-event.json').read_text())
          assert result['status'] == 'VALIDADO', result
          event = result['event']
          assert event['payload']['is_realtime_feed'] is False
          assert event['payload']['reconciliation_result'] == 'FAIL_CONTENT_DIVERGENCE'
          assert event['state'] == 'DEGRADED' and event['severity'] == 'HIGH'
          print('Persisted evidence OK; REC-001 correctly remains DEGRADED/HIGH; no event written.')
          PY

      - name: Contract validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path("WATCHDOG/schema/event.schema.json").read_text())
          config = json.loads(Path("WATCHDOG/config/watchdog.example.json").read_text())
          assert schema["properties"]["severity"]["enum"] == ["INFO","LOW","MEDIUM","HIGH","CRITICAL"]
          assert schema["properties"]["state"]["enum"] == ["UP","DEGRADED","DOWN","STALE","UNKNOWN"]
          assert config["heartbeat_interval_seconds"] > 0
          assert config["sources"]
          print("WATCHDOG contract OK")
          PY

      - name: Supervisor note
        run: |
          echo "WATCHDOG supervisor check OK"
          echo "GitHub Actions is auxiliary supervision, not the production 24x7 runtime."
