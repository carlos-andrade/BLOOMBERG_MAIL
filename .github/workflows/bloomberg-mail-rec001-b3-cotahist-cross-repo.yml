name: BLOOMBERG_MAIL — REC-001 B3 COTAHIST Cross-Repo
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rec001_b3_cotahist_cross_repo.py'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Comparar COTAHIST
        run: python scripts/rec001_b3_cotahist_cross_repo.py
      - name: Publicar evidência
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/REC001_B3_COTAHIST_CROSS_REPO_2026-10-08.json
          git diff --cached --quiet || git commit -m "test(rec001): evidência COTAHIST B3 cross-repo"
          git push
