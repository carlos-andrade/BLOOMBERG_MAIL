name: BLOOMBERG_MAIL — INGESTÃO 005-C — Tesouro + VIX

on:
  push:
    paths:
      - ".github/workflows/bloomberg-mail-ingestao-005c-tesouro-vix.yml"
  workflow_dispatch:
    inputs:

      vix_file:
        description: "Nome do arquivo VIX"
        required: true
        default: "VIX_History.csv"
        type: string

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preparar diretórios
        run: |
          set -euo pipefail
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/RAW
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO

      - name: Adquirir Tesouro — fonte oficial resolvida
        env:
          TESOURO_URL: "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/precotaxatesourodireto.csv"
        run: |
          set -euo pipefail
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/precotaxatesourodireto.csv"
          if [ -e "$out" ]; then
            echo "RAW Tesouro já existe; reutilizando sem sobrescrita."
          else
            curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$TESOURO_URL"
          fi
          sha256sum "$out" | tee "EMAILS_RECEBIDOS/INGESTAO/005/RAW/precotaxatesourodireto.csv.sha256"
          test -s "$out"
          file "$out"

      - name: Adquirir VIX — Cboe oficial
        env:
          VIX_FILE: ${{ inputs.vix_file || 'VIX_History.csv' }}
        run: |
          set -euo pipefail
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/$VIX_FILE"
          url="https://cdn-api.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"
          if [ -e "$out" ]; then
            echo "RAW VIX já existe; reutilizando sem sobrescrita."
          else
            curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$url"
          fi
          sha256sum "$out" | tee "EMAILS_RECEBIDOS/INGESTAO/005/RAW/$VIX_FILE.sha256"
          test -s "$out"
          python - "$out" <<'PY'
          import csv,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          rows=list(csv.DictReader(p.open(encoding="utf-8-sig",newline="")))
          required={"DATE","OPEN","HIGH","LOW","CLOSE"}
          assert rows, "VIX sem registros"
          assert required.issubset(rows[0]), f"Colunas VIX ausentes: {required-set(rows[0])}"
          assert all(r["DATE"] and r["CLOSE"] for r in rows), "VIX contém data/fechamento vazio"
          print(f"VIX structural/date presence validation: PASS ({len(rows)} rows)")
          PY

      - name: REC-001 VIX — reconciliação independente
        env:
          VIX_FILE: ${{ inputs.vix_file || 'VIX_History.csv' }}
        run: |
          set -euo pipefail
          raw="EMAILS_RECEBIDOS/INGESTAO/005/RAW/$VIX_FILE"
          tmp="$(mktemp --suffix=.csv)"
          trap 'rm -f "$tmp"' EXIT
          curl --fail --location --retry 3 --retry-delay 2 --output "$tmp" "https://cdn-api.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"
          python - "$raw" "$tmp" <<'PY'
          import csv, hashlib, json, sys
          from pathlib import Path
          raw=Path(sys.argv[1]); endpoint=Path(sys.argv[2])
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024), b""): h.update(chunk)
              return h.hexdigest()
          def read(p):
              with p.open(encoding="utf-8-sig", newline="") as f:
                  r=csv.DictReader(f)
                  header=r.fieldnames
                  rows=list(r)
              return header, [(x["DATE"],x["OPEN"],x["HIGH"],x["LOW"],x["CLOSE"]) for x in rows]
          rh,rr=read(raw); eh,er=read(endpoint)
          equal=(rh==eh==["DATE","OPEN","HIGH","LOW","CLOSE"] and rr==er)
          report={"dataset":"VIX","result":"PASS" if equal else "FAIL","endpoint":"https://cdn-api.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv","raw_sha256":sha(raw),"endpoint_sha256":sha(endpoint),"raw_records":len(rr),"endpoint_records":len(er),"headers_equal":rh==eh,"semantic_records_equal":equal,"raw_preserved":True,"promotion_impact":"VIX_REC_RECONCILED" if equal else "BLOCKED_RECONCILIATION_MISMATCH"}
          out=Path("EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/EXECUCAO_AUTOMATICA")
          out.mkdir(parents=True,exist_ok=True)
          (out/"rec001_vix.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (out/"rec001_vix.md").write_text("# REC-001 VIX — Reconciliação independente\n\n"+json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2))
          raise SystemExit(0 if equal else 1)
          PY

      - name: Evidência de aquisição
        env:
          TESOURO_URL: "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/precotaxatesourodireto.csv"
          VIX_FILE: ${{ inputs.vix_file || 'VIX_History.csv' }}
        run: |
          set -euo pipefail
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "# INGESTÃO 005-C — aquisição controlada Tesouro + VIX"
            echo
            echo "- timestamp_utc: $ts"
            echo "- Tesouro URL: $TESOURO_URL"
            echo "- Tesouro arquivo: precotaxatesourodireto.csv"
            echo "- VIX arquivo: $VIX_FILE"
            echo "- Política RAW: imutável; arquivos existentes não são sobrescritos."
            echo "- Gate: aquisição concluída não implica aprovação da Layer A."
          } > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/execucao_005c.md

      - name: Publicar evidência
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/RAW EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO
          git commit -m "INGESTAO 005-C: aquisição controlada Tesouro e VIX" || echo "Sem alterações"
          git push
