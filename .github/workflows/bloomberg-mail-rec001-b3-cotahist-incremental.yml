name: BLOOMBERG_MAIL — REC-001 B3 COTAHIST Reconciliação incremental oficial

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/rec001_b3_cotahist_incremental_v16.py"
      - "scripts/tests/test_rec001_b3_incremental.py"
      - ".github/workflows/bloomberg-mail-rec001-b3-cotahist-incremental.yml"

permissions:
  contents: write

concurrency:
  group: bloomberg-mail-rec001-b3-cotahist-incremental
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Testes determinísticos da reconciliação incremental
        run: python -m unittest scripts.tests.test_rec001_b3_incremental -v
      - name: Comparar RAW local com endpoint oficial B3
        run: python scripts/rec001_b3_cotahist_incremental_v16.py
      - name: Publicar evidência sem alterar RAW ou manifesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/REC001_B3_COTAHIST_INCREMENTAL_2026-10-09.json
          git diff --cached --quiet || git commit -m "data(rec001): publicar reconciliação incremental B3 oficial"
          git push
