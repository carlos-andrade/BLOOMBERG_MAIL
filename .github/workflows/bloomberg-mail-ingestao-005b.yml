name: BLOOMBERG_MAIL — INGESTÃO 005-B — aquisição controlada

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Fonte a adquirir"
        required: true
        default: "CVM"
        type: choice
        options:
          - CVM
          - BCB
      reference:
        description: "Referência"
        required: false
        default: "oferta_distribuicao.zip"
        type: string

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preparar diretórios
        run: |
          set -euo pipefail
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/RAW
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/NORMALIZADO
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO

      - name: Adquirir CVM
        if: ${{ inputs.source == 'CVM' }}
        run: |
          set -euo pipefail
          url='https://dados.cvm.gov.br/dados/OFERTA/DISTRIB/DADOS/oferta_distribuicao.zip'
          out='EMAILS_RECEBIDOS/INGESTAO/005/RAW/oferta_distribuicao.zip'
          curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$url"
          sha256sum "$out" | tee EMAILS_RECEBIDOS/INGESTAO/005/RAW/oferta_distribuicao.zip.sha256
          file "$out"
          unzip -t "$out"

      - name: Adquirir BCB SGS
        if: ${{ inputs.source == 'BCB' }}
        run: |
          set -euo pipefail
          series='1178'
          url="https://api.bcb.gov.br/dados/serie/bcdata.sgs.${series}/dados/ultimos/10?formato=json"
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/bcb_sgs_${series}_ultimos_10.json"
          curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$url"
          sha256sum "$out" | tee "$out.sha256"
          python - <<'PY'
          import json
          p="EMAILS_RECEBIDOS/INGESTAO/005/RAW/bcb_sgs_1178_ultimos_10.json"
          with open(p,encoding="utf-8") as f: x=json.load(f)
          assert isinstance(x,list) and len(x)>0
          assert all("data" in r and "valor" in r for r in x)
          print("BCB JSON structural validation: PASS")
          PY

      - name: Manifesto da execução
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/retrieval_timestamp_utc.txt
          {
            echo "# INGESTÃO 005-B — execução"
            echo
            echo "- Fonte: ${{ inputs.source }}"
            echo "- Referência: ${{ inputs.reference }}"
            echo "- Runner: GitHub Actions"
            echo "- Data/hora UTC:"
            cat EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/retrieval_timestamp_utc.txt
            echo "- Regra: RAW imutável; checksum obrigatório; validação estrutural antes da promoção."
          } > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/execucao_005b.md

      - name: Publicar evidência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/
          git commit -m "INGESTAO 005-B: aquisição controlada ${{ inputs.source }}" || echo "Sem alterações"
          git push
