name: BLOOMBERG_MAIL — INGESTÃO 005-B — aquisição controlada B3

on:
  workflow_dispatch:
    inputs:
      b3_file:
        description: "Arquivo anual COTAHIST B3"
        required: true
        default: "COTAHIST_A2026.ZIP"
        type: string

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preparar diretórios
        run: |
          set -euo pipefail
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/RAW
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/NORMALIZADO
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO

      - name: Adquirir B3 COTAHIST
        run: |
          set -euo pipefail
          file_name='${{ inputs.b3_file }}'
          case "$file_name" in
            COTAHIST_A[0-9][0-9][0-9][0-9].ZIP) ;;
            *) echo "Arquivo B3 inválido: $file_name"; exit 1 ;;
          esac
          url="https://bvmf.bmfbovespa.com.br/InstDados/SerHist/${file_name}"
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/${file_name}"
          if [ -e "$out" ]; then echo "RAW B3 já existe; política imutável bloqueia sobrescrita: $out"; exit 1; fi
          curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$url"
          sha256sum "$out" | tee "${out}.sha256"
          file "$out"
          unzip -t "$out"
          python - "$out" <<'PY'
          import sys
          from zipfile import ZipFile
          p=sys.argv[1]
          with ZipFile(p) as z:
              names=z.namelist()
              assert names, "ZIP sem conteúdo"
              assert any("COTAHIST" in n.upper() for n in names), f"COTAHIST não encontrado: {names}"
          print("B3 COTAHIST ZIP structural validation: PASS")
          PY
          expected='4f2cf2aac1073446ccd827f5ba868fe5cf15d5cdc87d636178fe00ac06741768'
          actual="$(sha256sum "$out" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "B3 SHA-256 MISMATCH"
            echo "expected=$expected"
            echo "actual=$actual"
            exit 1
          fi
          echo "B3 SHA-256 reconciliation: PASS"
          printf '%s\n' "expected=$expected" "actual=$actual" > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/b3_sha_reconciliation.txt

      - name: Atualizar manifesto B3
        run: |
          set -euo pipefail
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/${{ inputs.b3_file }}"
          python - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path("EMAILS_RECEBIDOS/INGESTAO/005/manifesto_aquisicao.json")
          raw=Path(sys.argv[1])
          sha=raw.with_name(raw.name + ".sha256").read_text().split()[0]
          data=json.loads(p.read_text(encoding="utf-8"))
          for d in data["datasets"]:
              if d["id"] == "B3_COTACOES":
                  d["acquisition_status"]="ACQUIRED_RAW_VALIDATED_RECONCILED"
                  d["raw_file"]=str(raw)
                  d["checksum_sha256"]=sha
                  d["quality_status"]="STRUCTURAL_VALIDATION_PASS"
          data["updated_at"]=datetime.now(timezone.utc).isoformat()
          data["decision"]["layer_A_approved"]=False
          data["decision"]["reason"]="B3 RAW adquirido, ZIP validado e SHA reconciliado; CVM adquirido/validado; BCB amostra técnica; Tesouro e VIX permanecem pendentes."
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Manifesto da execução
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/retrieval_timestamp_utc.txt
          {
            echo "# INGESTÃO 005-B — execução B3"
            echo
            echo "- Fonte: B3"
            echo "- Referência: ${{ inputs.b3_file }}"
            echo "- Runner: GitHub Actions"
            echo "- Data/hora UTC:"
            cat EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/retrieval_timestamp_utc.txt
            echo "- Regra: RAW imutável; checksum obrigatório; validação estrutural antes da promoção."
          } > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/execucao_005b.md

      - name: Publicar evidência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/
          git commit -m "INGESTAO 005-B: aquisição controlada B3" || echo "Sem alterações"
          git push
