name: BLOOMBERG_MAIL — INGESTÃO 005-B — aquisição controlada

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Fonte a adquirir"
        required: true
        default: "CVM"
        type: choice
        options:
          - CVM
          - BCB
          - B3
      cvm_file:
        description: "Arquivo CVM"
        required: false
        default: "oferta_distribuicao.zip"
        type: string
      bcb_series:
        description: "Série BCB SGS"
        required: false
        default: "1178"
        type: string
      b3_file:
        description: "Arquivo anual COTAHIST B3"
        required: false
        default: "COTAHIST_A2026.ZIP"
        type: string

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preparar diretórios
        run: |
          set -euo pipefail
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/RAW
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/NORMALIZADO
          mkdir -p EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO

      - name: Adquirir CVM
        if: ${{ inputs.source == 'CVM' }}
        run: |
          set -euo pipefail
          url='https://dados.cvm.gov.br/dados/OFERTA/DISTRIB/DADOS/oferta_distribuicao.zip'
          out='EMAILS_RECEBIDOS/INGESTAO/005/RAW/oferta_distribuicao.zip'
          curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$url"
          sha256sum "$out" | tee EMAILS_RECEBIDOS/INGESTAO/005/RAW/oferta_distribuicao.zip.sha256
          file "$out"
          unzip -t "$out"

      - name: Adquirir BCB SGS
        if: ${{ inputs.source == 'BCB' }}
        run: |
          set -euo pipefail
          series='${{ inputs.bcb_series }}'
          url="https://api.bcb.gov.br/dados/serie/bcdata.sgs.${series}/dados/ultimos/10?formato=json"
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/bcb_sgs_${series}_ultimos_10.json"
          curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$url"
          sha256sum "$out" | tee "$out.sha256"
          python - "$out" <<'PY'
          import json, sys
          p=sys.argv[1]
          with open(p,encoding="utf-8") as f: x=json.load(f)
          assert isinstance(x,list) and len(x)>0
          assert all("data" in r and "valor" in r for r in x)
          print("BCB JSON structural validation: PASS")
          PY

      - name: Adquirir B3 COTAHIST
        if: ${{ inputs.source == 'B3' }}
        run: |
          set -euo pipefail
          file_name='${{ inputs.b3_file }}'
          case "$file_name" in
            COTAHIST_A[0-9][0-9][0-9][0-9].ZIP) ;;
            *) echo "Arquivo B3 inválido: $file_name"; exit 1 ;;
          esac
          url="https://bvmf.bmfbovespa.com.br/InstDados/SerHist/${file_name}"
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/${file_name}"
          if [ -e "$out" ]; then echo "RAW B3 já existe; política imutável bloqueia sobrescrita: $out"; exit 1; fi
          curl --fail --location --retry 3 --retry-delay 2 --output "$out" "$url"
          sha256sum "$out" | tee "${out}.sha256"
          file "$out"
          unzip -t "$out"
          python - "$out" <<'PY'
          import sys
          from zipfile import ZipFile
          p=sys.argv[1]
          with ZipFile(p) as z:
              names=z.namelist()
              assert names, "ZIP sem conteúdo"
              assert any("COTAHIST" in n.upper() for n in names), f"COTAHIST não encontrado: {names}"
          print("B3 COTAHIST ZIP structural validation: PASS")
          PY
          expected='4f2cf2aac1073446ccd827f5ba868fe5cf15d5cdc87d636178fe00ac06741768'
          actual="$(sha256sum "$out" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "B3 SHA-256 MISMATCH"
            echo "expected=$expected"
            echo "actual=$actual"
            exit 1
          fi
          echo "B3 SHA-256 reconciliation: PASS"
          printf '%s\n' "expected=$expected" "actual=$actual" > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/b3_sha_reconciliation.txt
      - name: Atualizar manifesto B3
        if: ${{ inputs.source == 'B3' }}
        run: |
          set -euo pipefail
          out="EMAILS_RECEBIDOS/INGESTAO/005/RAW/${{ inputs.b3_file }}"
          python - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path("EMAILS_RECEBIDOS/INGESTAO/005/manifesto_aquisicao.json")
          raw=Path(sys.argv[1])
          sha=raw.with_name(raw.name + ".sha256").read_text().split()[0]
          data=json.loads(p.read_text(encoding="utf-8"))
          for d in data["datasets"]:
              if d["id"] == "B3_COTACOES":
                  d["acquisition_status"]="ACQUIRED_RAW_VALIDATED_RECONCILED"
                  d["raw_file"]=str(raw)
                  d["checksum_sha256"]=sha
                  d["quality_status"]="STRUCTURAL_VALIDATION_PASS"
          data["updated_at"]="2026-10-07"
          data["decision"]["layer_A_approved"]=False
          data["decision"]["reason"]="B3 RAW adquirido, ZIP validado e SHA reconciliado; CVM adquirido/validado; BCB amostra técnica; Tesouro e VIX permanecem pendentes."
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Manifesto da execução
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/retrieval_timestamp_utc.txt
          {
            echo "# INGESTÃO 005-B — execução"
            echo
            echo "- Fonte: ${{ inputs.source }}"
            if [ "${{ inputs.source }}" = "CVM" ]; then
              reference="${{ inputs.cvm_file }}"
            elif [ "${{ inputs.source }}" = "BCB" ]; then
              reference="SGS:${{ inputs.bcb_series }}"
            else
              reference="${{ inputs.b3_file }}"
            fi
            echo "- Referência: ${reference}"
            echo "- Runner: GitHub Actions"
            echo "- Data/hora UTC:"
            cat EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/retrieval_timestamp_utc.txt
            echo "- Regra: RAW imutável; checksum obrigatório; validação estrutural antes da promoção."
          } > EMAILS_RECEBIDOS/INGESTAO/005/VALIDACAO/execucao_005b.md

      - name: Publicar evidência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/
          git commit -m "INGESTAO 005-B: aquisição controlada ${{ inputs.source }}" || echo "Sem alterações"
          git push
