name: BLOOMBERG_MAIL — INGESTÃO 005N — Validação Independente Normalização B3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate B3 normalized output
        run: python scripts/validacao_normalizacao_b3_005.py
      - name: Publish validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/NORMALIZADO/B3/VALIDACAO_NORMALIZACAO_B3_A2026.json
          if git diff --cached --quiet; then
            echo "Nenhum relatório novo."
          else
            git commit -m "BLOOMBERG_MAIL: publicar validação independente B3 005N"
            git push
          fi
