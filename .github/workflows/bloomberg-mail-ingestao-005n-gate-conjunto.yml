name: BLOOMBERG_MAIL — INGESTÃO 005N — Gate Conjunto 5/5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate-conjunto-5x5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Executar Gate Conjunto 005N
        run: python scripts/validacao_gate_conjunto_005n.py

      - name: Publicar evidência
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMAILS_RECEBIDOS/INGESTAO/005/NORMALIZADO/VALIDACAO_GATE_CONJUNTO_005N_5X5.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de evidência para publicar."
          else
            git commit -m "docs(005N): publicar gate conjunto 5x5"
            git push
          fi
